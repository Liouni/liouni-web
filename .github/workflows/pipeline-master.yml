name: Pipeline Web — liouni (master) via Komodo Webhook

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/liouni/liouni-web
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile || (bun pm cache rm || true; sleep 2; bun install --frozen-lockfile)
          else
            bun install
          fi
      - run: bun run check:ci

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile || (bun pm cache rm || true; sleep 2; bun install --frozen-lockfile)
          else
            bun install
          fi
      - run: bun test

  build-check:
    name: Build check (PR only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi
      - run: bun run build

  build-and-push:
    name: Build & Push Web image
    runs-on: ubuntu-latest
    needs: [static, test]
    timeout-minutes: 25
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_APP_NAME=${{ vars.APP_NAME || 'liouni' }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '' }}
            APP_ENV=production
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=liouni-web
          cache-to: type=gha,mode=max,scope=liouni-web

  trigger-deploy:
    name: Trigger Komodo Webhook (liouni-master-dev-web)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    timeout-minutes: 5
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
      KOMODO_WEBHOOK_URL: ${{ vars.KOMODO_WEBHOOK_URL || 'https://komodo.liouni.com' }}
      STACK_NAME: liouni-master-dev-web
      BRANCH: master
    steps:
      - name: Trigger Komodo Stack Deploy
        run: |
          set -euo pipefail
          test -n "$KOMODO_WEBHOOK_SECRET"
          payload="$(printf '{"ref":"refs/heads/%s"}' "$BRANCH")"
          sig="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" -hex | awk '{print $NF}')"
          curl --fail-with-body --silent --show-error \
            -X POST "${KOMODO_WEBHOOK_URL%/}/listener/github/stack/${STACK_NAME}/deploy" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: $sig" \
            --data "$payload"
