services:
  web:
    image: ${APP_WEB_IMAGE:?APP_WEB_IMAGE is required}
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      API_UPSTREAM_URL: ${API_UPSTREAM_URL:-liouni-master-dev-api-api-1:3000}
    expose: ["80"]
    ports: ["100.90.103.19:8010:80"]
    networks: [npm-network]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
networks:
  npm-network:
    external: true
    name: npm-network
